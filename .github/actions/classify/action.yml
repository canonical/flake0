name: classify
description: >-
  Runs an opencode agent, through OpenRouter, over this job's collect bundle and
  source to tell whether it failed from flakiness or a real bug. Add it as the
  last step of the test job. Part of the Flake0 AI debugging suite.
author: canonical
branding:
  icon: help-circle
  color: orange

inputs:
  openrouter-api-key:
    description: "OpenRouter API key, usually secrets.OPENROUTER_API_KEY. Fork pull requests get it as an empty string, which skips classification."
    required: true
  bundle-path:
    description: "The collect stop phase's bundle-path output"
    required: false
    default: ""
  job-name:
    description: "Job name in the prompt and the summary"
    required: false
    default: ${{ github.job }}
  model:
    description: "OpenRouter model slug"
    required: false
    default: "deepseek/deepseek-v4.1-flash"
  github-token:
    description: "Read-only token for run history and the pull request diff"
    required: false
    default: ${{ github.token }}

outputs:
  verdict-path:
    description: "Path to verdict.json, empty if classification was skipped"
    value: ${{ steps.run.outputs.verdict-path }}

runs:
  using: composite
  steps:
    - name: Install opencode
      id: install
      if: ${{ inputs.openrouter-api-key != '' }}
      continue-on-error: true
      shell: bash
      # Full paths: PR code can put its own sudo or snap first through $GITHUB_PATH
      run: |
        /usr/bin/sudo /usr/bin/snap install opencode --classic --channel=2/stable
        echo "bin=/snap/bin/opencode" >> "$GITHUB_OUTPUT"

    - name: Classify failure
      id: run
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        OPENCODE_BIN: ${{ steps.install.outputs.bin }}
        MODEL: ${{ inputs.model }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BUNDLE_PATH: ${{ inputs.bundle-path }}
        JOB_NAME: ${{ inputs.job-name }}
      run: "$GITHUB_ACTION_PATH/scripts/run.sh"
