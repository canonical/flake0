# flake0 — Telegraf configuration for host metrics collection
# Pinned for Telegraf v1.39.2.
#
# ${VARS} are expanded by Telegraf itself from its environment. start.sh
# passes them explicitly through `sudo env ...` so they survive the sudo env scrub.
# Do NOT pre-substitute these with sed: tag values may legally contain sed
# metacharacters (a workflow named "build | test" is valid) and Telegraf's own
# expansion handles them correctly.
#
# Sampling tiers (see docs/plan.md §7 for measured costs):
#   2 s  — cheap, high-signal counters (PSI, cpu, mem, net, conntrack)
#   10 s — moderately expensive /proc walks (disk, diskio, netstat, system)
#   30 s — full process-table walks (procstat, processes)
# Interval placement is a CPU-budget decision, not an arbitrary one: a plugin's
# cost is (gather_time / interval). Verify with:
#   jq -r '.metrics[]|select(.name=="internal_gather")|"\(.tags.input) \(.fields.gather_time_ns)"'

#------------------------------------------------------------------------------
# Agent
#------------------------------------------------------------------------------
[agent]
  interval = "2s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "1s"
  precision = ""
  debug = false
  quiet = true
  omit_hostname = false

#------------------------------------------------------------------------------
# Run-correlation tags (present on every metric document)
#------------------------------------------------------------------------------
[global_tags]
  run_id = "${GITHUB_RUN_ID}"
  run_attempt = "${GITHUB_RUN_ATTEMPT}"
  repo = "${GITHUB_REPOSITORY}"
  workflow = "${GITHUB_WORKFLOW}"
  job = "${GITHUB_JOB}"
  sha = "${GITHUB_SHA}"
  ref = "${GITHUB_REF_NAME}"
  runner_name = "${RUNNER_NAME}"
  runner_os = "${RUNNER_OS}"
  image_os = "${ImageOS}"

#------------------------------------------------------------------------------
# Tier 1 — 2 s: cheap counters, the core flakiness signal
#------------------------------------------------------------------------------

# Per-core + total CPU; includes usage_steal (noisy-neighbor signal on hosted runners)
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]

[[inputs.swap]]

# Context switches, forks, interrupts + PSI (pressure stall information —
# the top flakiness signal: actual cpu/mem/io stall time)
[[inputs.kernel]]
  collect = ["psi"]

# Per-interface traffic/errors/drops (skip per-container veth churn)
[[inputs.net]]
  interfaces = ["eth*", "en*", "docker0", "lxdbr*", "br-*", "virbr*"]

# Extended TCP stats (retransmit failures, timeouts, SYN retransmits)
[[inputs.nstat]]

# File-handle / inode-handle usage
[[inputs.linux_sysctl_fs]]

# Self-monitoring: proves the collector stays inside its overhead budget.
# internal_gather.gather_time_ns is how we attribute cost per input.
[[inputs.internal]]
  collect_memstats = true

#------------------------------------------------------------------------------
# Tier 2 — 10 s: moderate /proc walks
#------------------------------------------------------------------------------

# Filesystem bytes + inodes; skip pseudo/noise filesystems.
# 10 s: filesystems fill gradually; 2 s resolution buys nothing.
[[inputs.disk]]
  interval = "10s"
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs", "nsfs", "ramfs", "fusectl"]

# IOPS/throughput/await/util per block device (skip loop/ram noise).
# 10 s: inputs.kernel PSI already reports io stall *time* at 2 s; diskio answers
# the follow-up "which device", which does not need 2 s resolution.
[[inputs.diskio]]
  interval = "10s"
  devices = ["sd*", "vd*", "xvd*", "nvme*", "dm-*"]
  skip_serial_number = true

# Load averages, n_cpus, uptime
[[inputs.system]]
  interval = "10s"

# TCP stack counters incl. retransmits.
# 10 s: measured at ~50 ms/gather (walks /proc/net/tcp), too costly at 2 s.
[[inputs.netstat]]
  interval = "10s"

#------------------------------------------------------------------------------
# Tier 3 — 30 s: full process-table walks
#------------------------------------------------------------------------------

# Per-process stats for daemons that matter in Juju CI, plus telegraf itself so
# the bundle carries proof of the collector's own overhead (see smoke.yml).
#
# One consolidated block, not one per daemon: nine blocks meant nine independent
# process-table sweeps per interval (measured 667 ms/gather vs 160 ms here).
# process_name still tags each series, so per-daemon attribution is unchanged.
#
# fielddrop cmdline: procstat records full command lines by default, which would
# publish any secret passed in argv into a repo-readable workflow artifact.
# pid_finder native: matches in-process, no pgrep fork and no procps dependency.
# tagexclude pattern: the alternation below would otherwise be repeated as a tag
# on every procstat document.
#
# The pytest arms are anchored like the daemons. A bare "pytest" matched any
# command line merely containing the string — verified to pick up unrelated
# processes such as "pytest-cache-helper" and the shell that launched the test.
# A wrapper shell whose argv contains the pytest path still matches; that is
# inherent to cmdline matching and harmless (it is one extra series).
#
# Tradeoff of the 30 s tier: processes living less than ~30 s may be missed
# entirely. That is acceptable here because integration-test processes run for
# minutes, and per-test correlation comes from conftest markers (phase 3), not
# from sampling the pytest process.
[[inputs.procstat]]
  interval = "30s"
  pattern = "(^|/)(jujud|containerd|dockerd|lxd|snapd|kubelet|pebble|mongod|telegraf)( |$)|(^|/)pytest( |$)|-m[ ]+pytest( |$)"
  pid_finder = "native"
  fielddrop = ["cmdline"]
  tagexclude = ["pattern"]

# Process state counts (running/blocked(D)/zombie...)
# 30 s: walks every /proc/<pid>/stat (measured ~88 ms/gather).
[[inputs.processes]]
  interval = "30s"

#------------------------------------------------------------------------------
# Outputs
#------------------------------------------------------------------------------

# Phase 1 (PoC)–phase 4: local file, bundled as a workflow artifact.
# One JSON array per flush batch; ingest script flattens with `jq -c '.[]'`.
#
# rotation_max_size is a safety valve, not an expected code path: a typical
# 30-min run writes ~10-20 MB (see docs/plan.md §5.2). If it ever trips,
# Telegraf writes metrics.json plus timestamped siblings — the bundle picks up
# the whole directory, but ingest must then glob metrics.json* rather than
# reading a single file.
[[outputs.file]]
  files = ["${FLAKE0_COLLECT_DIR}/metrics.json"]
  data_format = "json"
  json_timestamp_units = "1ms"
  use_batch_format = true
  rotation_max_size = "512MB"

