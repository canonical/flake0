summary: a follower drops, a model comes and goes, and valkey logs then goes, after Juju bootstraps late
environment:
  CONSUMER/valkey_lxd,valkey_k8s: valkey
  CONSUMER/opensearch_lxd,opensearch_k8s: opensearch
  SUBSTRATE/valkey_lxd,opensearch_lxd: lxd
  SUBSTRATE/valkey_k8s,opensearch_k8s: k8s
prepare: |
  "$SPREAD_PATH/tests/spread/prepare-$CONSUMER.sh"
execute: |
  set -euo pipefail
  CTL="concierge-$SUBSTRATE"
  # flake0's followers are the only processes whose command line ends like this
  follower() { printf 'debug-log (--replay )?--tail --date --utc --ms -m %s$' "$1"; }
  wait_follower() {
    for _ in $(seq 60); do
      pgrep -f -- "$(follower "$1")" > /dev/null && return 0
      sleep 5
    done
    return 1
  }

  # valkey is the lightest Data Platform database that has one charm for machines and K8s
  juju deploy -m "$CTL:testing" valkey --channel 9/edge --trust
  juju wait-for application valkey -m "$CTL:testing" --query='status=="active"' --timeout 20m
  wait_follower "$CTL:testing"

  # Drop the stream, then log a known line. check.sh looks for it after the marker.
  pkill -f -- "$(follower "$CTL:testing")"
  sleep 10
  mkdir -p /tmp/flake0-sim
  TOKEN="flake0-sim-$(cat /proc/sys/kernel/random/uuid)"
  juju exec -m "$CTL:testing" --unit valkey/0 -- juju-log "$TOKEN"
  echo "$TOKEN" > /tmp/flake0-sim/token
  # On K8s, juju-log above also reaches the charm container's stdout. On LXD,
  # put the token in the unit's journal too.
  if [ "$SUBSTRATE" = lxd ]; then
    juju exec -m "$CTL:testing" --unit valkey/0 -- logger "$TOKEN"
  fi

  # A model that lives for part of the run, like jubilant's temp_model
  juju add-model -c "$CTL" extra
  wait_follower "$CTL:extra"
  sleep 75
  juju destroy-model --no-prompt --destroy-storage --force "$CTL:extra"
  sleep 60

  # Remove the database while collection runs. check.sh still expects its logs.
  juju remove-application -m "$CTL:testing" --no-prompt --destroy-storage valkey
  for _ in $(seq 60); do
    juju status -m "$CTL:testing" --format=json | jq -e '.applications.valkey == null' > /dev/null && exit 0
    sleep 5
  done
  echo "valkey was not removed"
  exit 1
